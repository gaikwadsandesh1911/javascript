<!-- 

HTML:
    HTML stands for hypertext markup language.
    Its standard markup language used to create structure and 
    format of the content to be displayed on webpage.


Hypertext:
    hypertext is text that contains links to other documents, pages or resources.


Markup:
    Html tags are markup itself.
    that define structure and meaning of the content.

tag:
    tag is keyword enclosed in angle bracket <>.
    used to create html elements.


element:
    element consists of opening tag, content, closing tag.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="" href="">
</head>
<body>
    
</body>
</html>

<!-- 

<!DOCTYPE html>     tells browser that document uses html 5 standard.

<html>              it's root element of html document.

<head>              contains information related to page such as title, metadata, css links etc.

<title>             define title of webpage, displayed in browser tab, useful for search engine.

<body>              contains html elements that displays actual content on web pages.

-->


<!-- 

<div> vs <span>

    <div> is block level container while <span> is inline container.
    both are used to  group other html elements for styling purpose.
    
    block level elements start on new line and takes available width
    inline takes width required by its content.

    Block: <div>, <p>, <h1>, <section>
    Inline: <span>, <a>, <strong>, <img>
     
-->


<!--

void elements:
    some elements like <img>, <br>, <hr>, <input>, <meta>, <link>
    don’t have content and closing tag those elements called void elements.
    
-->


<!-- 

semantic elements:
    semantic element like <header>, <nav>, <main>, <section>, <article>, <aside>, and <footer>
    cleary describe meaning of the content.

-->

<!-- 

html attribute
    attribute provides additional information about html elements,

    <img src="img_girl.jpg">
    
    <a href="https://www.w3schools.com">Visit W3Schools</a>

    src, href are the attribute.

-->

<!-- 

Headings: <h1> to <h6>
    to define title or subtitle of the webpages, heading tags are used.
    we have a range of <h1> to <h6> tags.
    <h1> defines the most important heading. <h6> defines the least important heading.

<p>:    to define paragraph <p> tag is used.

<hr>:   adds horizontal line on webpage.

<br>:   adds a line break. without starting new paragraph.
    
-->


<!-- 

HTML formating elements:
    to display special type of text html formating elements are used.

    <b> - Bold text
    <strong> - Important text
    <i> - Italic text
    <em> - Emphasized text
    <mark> - Marked text...yellow background
    <small> - Smaller text
    <del> - Deleted text... browser strike a line through the words
    <ins> - Inserted text... browser underlines the word
    <sub> - Subscript text...h<sub>2</sub>o
    <sup> - Superscript text...e = mc<sup>2</sup>
-->


<!-- 

Quotation and Citation Elements:

<blockquote>:   tag define section that is quoted from another source. 
                browser indent blockquote element.
                cite attribute is used to name the source.
    
                <blockquote cite="http://www.worldwildlife.org/who/index.html">
                    For 60 years, WWF has worked to help people and nature thrive. As the world's leading conservation organization, WWF works in nearly 100 countries. At every level, we collaborate with people around the world to develop and deliver innovative solutions that protect communities, wildlife, and the places in which they live.
                </blockquote>


<q>:            tag define short quotation. browser add quotation mark around it.

                <p>WWF's goal is to: <q>Build a future where people live in harmony with nature.</q></p>


<abbr>:         tag define abbreviation or an acronym.
                title attribute is used to show the description for the abbreviation/acronym when you mouse over the element. 

                <p>The <abbr title="World Health Organization">WHO</abbr> was founded in 1948.</p>


<address>       tag define contact information for owner of document or article.
                contact info can be email, url, physical address, phone no. social media handle. etc.
                It renders in italic.
                browser add line break before and after <address> element


<cite>          tag defines title of creative work (eg. book, poem, movie, song etc.)
                It is render in italic.

                <p><cite>The Scream</cite> by Edvard Munch. Painted in 1893.</p>
-->


<!-- 

HTML Lists
    to display related items in the list format HTML list is used.
    we have:

        1. unorderd list <ul> - items will be displayed with bullets by default.
        
        2. ordered list  <ol> - items will be displayed with numbers by default.
        
        3. Description List <dl> - is list of terms.
            <dt> defines terms, <dd> describe each term

            <dl>
                <dt> Coffee </dt>
                <dd> black hot drink </dd>
            </dl>
            
-->

<!-- 

HTML Table:
    to arrange data into rows and column is used.
    we have:

    <table> tag to make table
    <tr>    that is table row
    <th>    that is table head
    <td>    that is table data.

    <th colspan="2">    to make cell span over multiple column, colspan attribute is used.
     
    <th colspan="2">    to make cell span over multiple rows, rowspan attribute is used.

-->

<iframe>
    To embed other document or display other webpage within current webpage iframe is used.

<iframe src="url" title="description" name="iframe_a" 
        style="border:none;" height="200" width="200">

<!-- 

HTML Entities:
    To displayed reserverd character like <, > entity name or number can be used.
        
        < is &lt;
        > is &gt;

Symbol Entities:
    symbol and letters that are not available on keyboard can also be
